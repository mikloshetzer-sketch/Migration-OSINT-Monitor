name: X Historical Backfill

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Inclusive historical start date (YYYY-MM-DD)"
        required: true
        default: "2026-06-15"
        type: string

      end_date:
        description: "Inclusive historical end date (YYYY-MM-DD)"
        required: true
        default: "2026-06-15"
        type: string

      max_posts_per_day:
        description: "Hard X post budget per calendar day across all query groups"
        required: true
        default: "100"
        type: string

      max_total_posts:
        description: "Hard X post budget for the entire backfill run"
        required: true
        default: "500"
        type: string

      max_pages_per_query_day:
        description: "Maximum X API pages per query group per day"
        required: true
        default: "3"
        type: string

      quiet_log:
        description: "Reduce per-post GitHub Actions logging"
        required: true
        default: false
        type: boolean

      max_rate_limit_retries:
        description: "Retries after X HTTP 429"
        required: true
        default: "3"
        type: string

      max_rate_limit_wait_seconds:
        description: "Maximum single wait allowed after HTTP 429"
        required: true
        default: "900"
        type: string

      inter_request_delay_seconds:
        description: "Delay between successful X API requests"
        required: true
        default: "2"
        type: string

permissions:
  contents: write

jobs:
  x-historical-backfill:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Migration OSINT database
        id: restore-database
        uses: actions/cache/restore@v4
        with:
          path: database/migration_osint_monitor.db
          key: migration-osint-db-${{ github.run_id }}
          restore-keys: |
            migration-osint-db-

      - name: Verify restored database
        run: |
          if [ -f database/migration_osint_monitor.db ]; then
            echo "Existing migration_osint_monitor.db restored."
            ls -lh database/migration_osint_monitor.db
          else
            echo "ERROR: Backfill requires the existing Migration OSINT database."
            echo "Run the normal monitor first so a database cache exists."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show backfill safety limits
        run: |
          echo "==================================="
          echo "X HISTORICAL BACKFILL CONFIG"
          echo "==================================="
          echo "Source: X ONLY"
          echo "Start date: ${{ inputs.start_date }}"
          echo "End date: ${{ inputs.end_date }}"
          echo "Max posts/day: ${{ inputs.max_posts_per_day }}"
          echo "Max total posts: ${{ inputs.max_total_posts }}"
          echo "Max pages/query/day: ${{ inputs.max_pages_per_query_day }}"
          echo "Quiet log: ${{ inputs.quiet_log }}"
          echo "Rate-limit retries: ${{ inputs.max_rate_limit_retries }}"
          echo "Max rate-limit wait: ${{ inputs.max_rate_limit_wait_seconds }} seconds"
          echo "Inter-request delay: ${{ inputs.inter_request_delay_seconds }} seconds"
          echo "Reddit: DISABLED"
          echo "Mastodon: DISABLED"

      - name: Run X historical backfill
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}

          X_BACKFILL_START_DATE: ${{ inputs.start_date }}
          X_BACKFILL_END_DATE: ${{ inputs.end_date }}

          X_BACKFILL_MAX_POSTS_PER_DAY: ${{ inputs.max_posts_per_day }}
          X_BACKFILL_MAX_TOTAL_POSTS: ${{ inputs.max_total_posts }}
          X_BACKFILL_MAX_PAGES_PER_QUERY_DAY: ${{ inputs.max_pages_per_query_day }}

          X_BACKFILL_REQUEST_PAGE_SIZE: "100"
          X_BACKFILL_QUIET: ${{ inputs.quiet_log }}

          X_BACKFILL_MAX_RATE_LIMIT_RETRIES: ${{ inputs.max_rate_limit_retries }}
          X_BACKFILL_MAX_RATE_LIMIT_WAIT_SECONDS: ${{ inputs.max_rate_limit_wait_seconds }}
          X_BACKFILL_INTER_REQUEST_DELAY_SECONDS: ${{ inputs.inter_request_delay_seconds }}

        run: |
          python analysis/x_full_archive_test.py

      - name: Show backfill database date coverage
        env:
          X_BACKFILL_START_DATE: ${{ inputs.start_date }}
          X_BACKFILL_END_DATE: ${{ inputs.end_date }}
        run: |
          python - <<'PY'
          import os
          import sqlite3
          from datetime import date, timedelta

          db = "database/migration_osint_monitor.db"
          start = date.fromisoformat(os.environ["X_BACKFILL_START_DATE"])
          end = date.fromisoformat(os.environ["X_BACKFILL_END_DATE"])
          end_exclusive = end + timedelta(days=1)

          con = sqlite3.connect(db)

          try:
              tables = [
                  row[0]
                  for row in con.execute(
                      "SELECT name FROM sqlite_master "
                      "WHERE type='table' "
                      "AND name NOT LIKE 'sqlite_%' "
                      "ORDER BY name"
                  )
              ]

              print("Historical range:", start, "->", end)

              for table in tables:
                  safe_table = table.replace('"', '""')

                  cols = [
                      row[1]
                      for row in con.execute(
                          f'PRAGMA table_info("{safe_table}")'
                      )
                  ]

                  for column in (
                      "published_at",
                      "event_time",
                      "timestamp",
                      "observed_at",
                      "created_at",
                  ):
                      if column not in cols:
                          continue

                      safe_column = column.replace('"', '""')

                      sql = (
                          f'SELECT COUNT(*) '
                          f'FROM "{safe_table}" '
                          f'WHERE "{safe_column}" IS NOT NULL '
                          f'AND datetime("{safe_column}") >= datetime(?) '
                          f'AND datetime("{safe_column}") < datetime(?)'
                      )

                      count = con.execute(
                          sql,
                          (
                              start.isoformat(),
                              end_exclusive.isoformat(),
                          ),
                      ).fetchone()[0]

                      if count:
                          print(
                              f"{table}.{column}: "
                              f"{count} historical rows"
                          )

          finally:
              con.close()
          PY

      - name: Export dashboard data
        run: |
          python -m dashboard.export_dashboard_data

      - name: Verify historical timeline export
        env:
          X_BACKFILL_START_DATE: ${{ inputs.start_date }}
          X_BACKFILL_END_DATE: ${{ inputs.end_date }}
        run: |
          python - <<'PY'
          import json

          with open(
              "dashboard-data.json",
              "r",
              encoding="utf-8",
          ) as f:
              data = json.load(f)

          timeline = (
              data.get(
                  "signal_timeline",
                  {},
              )
              or {}
          )

          print(
              "Timeline schema:",
              timeline.get(
                  "schema_version"
              ),
          )

          print(
              "History days:",
              timeline.get(
                  "history_days"
              ),
          )

          print(
              "Timeline items:",
              timeline.get(
                  "total_items"
              ),
          )

          print(
              "Layer counts:",
              timeline.get(
                  "layer_counts"
              ),
          )

          current_run = (
              data.get(
                  "current_run",
                  {}
              )
              or {}
          )

          print(
              "Dashboard current run status:",
              current_run.get(
                  "status"
              ),
          )

          if (
              current_run.get(
                  "status"
              )
              == "BACKFILL_SUCCESS"
          ):
              raise SystemExit(
                  "ERROR: Backfill incorrectly became the dashboard Current Run."
              )

          import os
          from datetime import date, datetime

          start = date.fromisoformat(
              os.environ[
                  "X_BACKFILL_START_DATE"
              ]
          )

          end = date.fromisoformat(
              os.environ[
                  "X_BACKFILL_END_DATE"
              ]
          )

          matching = []

          for item in (
              timeline.get(
                  "items",
                  [],
              )
              or []
          ):
              raw = item.get(
                  "timestamp"
              )

              if not raw:
                  continue

              try:
                  ts = datetime.fromisoformat(
                      str(raw).replace(
                          "Z",
                          "+00:00",
                      )
                  )
              except ValueError:
                  continue

              if (
                  start
                  <= ts.date()
                  <= end
              ):
                  matching.append(
                      item
                  )

          print(
              "Timeline records inside backfill window:",
              len(
                  matching
              ),
          )

          layer_counts = {}

          for item in matching:
              layer = str(
                  item.get(
                      "layer",
                      "UNKNOWN",
                  )
              )

              layer_counts[layer] = (
                  layer_counts.get(
                      layer,
                      0,
                  )
                  + 1
              )

          print(
              "Backfill-window timeline layers:",
              layer_counts,
          )

          if not matching:
              print(
                  "WARNING: exporter produced ZERO timeline "
                  "records inside the backfill date range."
              )
          PY

      - name: Publish dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dashboard-data.json

          if git diff --cached --quiet; then
            echo "No dashboard data changes to commit."
          else
            git commit -m "Update Migration OSINT historical backfill data"
            git push origin HEAD:main
          fi

      - name: Verify database after backfill
        if: always()
        run: |
          if [ -f database/migration_osint_monitor.db ]; then
            echo "migration_osint_monitor.db exists after backfill."
            ls -lh database/migration_osint_monitor.db
          else
            echo "WARNING: migration_osint_monitor.db was not found."
          fi

      - name: Save Migration OSINT database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: database/migration_osint_monitor.db
          key: migration-osint-db-${{ github.run_id }}
