
name: Migration OSINT Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */2 * * *"

permissions:
  contents: write

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Migration OSINT database
        id: restore-database
        uses: actions/cache/restore@v4
        with:
          path: database/migration_osint_monitor.db
          key: migration-osint-db-${{ github.run_id }}
          restore-keys: |
            migration-osint-db-

      - name: Show database restore status
        run: |
          if [ -f database/migration_osint_monitor.db ]; then
            echo "Existing migration_osint_monitor.db restored successfully."
            ls -lh database/migration_osint_monitor.db
          else
            echo "No previous migration_osint_monitor.db found."
            echo "A new database will be created during this run."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "telethon>=1.44,<2"

      - name: Run Migration OSINT Monitor
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}

          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}

          MASTODON_BASE_URL: ${{ secrets.MASTODON_BASE_URL }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}

          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}

        run: |
          python main.py

      - name: Export dashboard data
        run: |
          python -m dashboard.export_dashboard_data

      - name: Verify dashboard JSON
        run: |
          if [ -f dashboard-data.json ]; then
            echo "dashboard-data.json generated successfully."
            ls -lh dashboard-data.json

            echo "==================================="
            echo "DASHBOARD JSON PREVIEW"
            echo "==================================="

            python - <<'PY'
          import json

          with open(
              "dashboard-data.json",
              "r",
              encoding="utf-8",
          ) as f:
              data = json.load(f)

          print(
              "Updated:",
              data.get(
                  "updated_at"
              ),
          )

          print(
              "KPIs:",
              data.get(
                  "kpis"
              ),
          )

          print(
              "Live events:",
              len(
                  data.get(
                      "live_events",
                      [],
                  )
              ),
          )

          print(
              "Event groups:",
              len(
                  data.get(
                      "event_groups",
                      [],
                  )
              ),
          )

          print(
              "Sources:",
              len(
                  data.get(
                      "source_activity",
                      [],
                  )
              ),
          )

          telegram_sources = [
              item
              for item
              in (
                  data.get(
                      "source_activity",
                      [],
                  )
                  or []
              )
              if str(
                  item.get(
                      "source",
                      ""
                  )
              ).upper() == "TELEGRAM"
          ]

          print(
              "Telegram source activity:",
              telegram_sources,
          )

          print(
              "Operational assessment:",
              data.get(
                  "operational_assessment",
                  {},
              ),
          )
          PY

          else
            echo "ERROR: dashboard-data.json was not generated."
            exit 1
          fi

      # ================================================
      # SOURCE INTELLIGENCE - INDEPENDENT EXPORT
      # ================================================

      - name: Export Source Intelligence
        id: source-intelligence
        continue-on-error: true
        run: |
          python -m analysis.export_source_intelligence

      - name: Verify Source Intelligence JSON
        if: steps.source-intelligence.outcome == 'success'
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("source-intelligence.json")

          if not path.is_file():
              raise SystemExit(
                  "Source Intelligence output not found."
              )

          with path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          assert isinstance(data.get("posts"), list)
          assert isinstance(data.get("daily_history"), list)
          assert isinstance(data.get("category_summary"), dict)

          print("Source Intelligence JSON verified.")
          print("Total posts:", data.get("total_posts"))
          print("Categories:", data.get("category_summary"))
          print("History days:", len(data["daily_history"]))
          PY

      # ================================================
      # EXISTING DASHBOARD PUBLICATION
      # ================================================

      - name: Publish dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dashboard-data.json

          if git diff --cached --quiet; then
            echo "No dashboard data changes to commit."
          else
            git commit -m "Update Migration OSINT dashboard data"
            git push origin HEAD:main
          fi

      # ================================================
      # SOURCE INTELLIGENCE PUBLICATION
      # ================================================

      - name: Publish Source Intelligence data
        if: steps.source-intelligence.outcome == 'success'
        continue-on-error: true
        run: |
          if [ ! -f source-intelligence.json ]; then
            echo "Source Intelligence file not available."
            exit 0
          fi

          git add source-intelligence.json

          if git diff --cached --quiet; then
            echo "No Source Intelligence changes to commit."
          else
            git commit -m "Update Source Intelligence data"
            git push origin HEAD:main
          fi

      # ================================================
      # EXISTING DATABASE VERIFICATION AND CACHE
      # ================================================

      - name: Verify database after run
        if: always()
        run: |
          if [ -f database/migration_osint_monitor.db ]; then
            echo "migration_osint_monitor.db exists after monitor run."
            ls -lh database/migration_osint_monitor.db
          else
            echo "WARNING: migration_osint_monitor.db was not found."
          fi

      - name: Save Migration OSINT database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: database/migration_osint_monitor.db
          key: migration-osint-db-${{ github.run_id }}

