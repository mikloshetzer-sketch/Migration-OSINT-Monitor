name: Create Telegram Session

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-telegram-session:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "telethon>=1.36,<2" "qrcode>=7.4,<9"

      - name: Create Telegram StringSession by QR login
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          python -u - <<'PY'
          import asyncio
          import os
          from pathlib import Path

          import qrcode
          from telethon import TelegramClient
          from telethon.errors import SessionPasswordNeededError
          from telethon.sessions import StringSession


          RESET = "\033[0m"
          FG_BLACK = "\033[30m"
          FG_WHITE = "\033[97m"
          BG_BLACK = "\033[40m"
          BG_WHITE = "\033[107m"


          def render_qr_for_github(url: str) -> None:
              """
              Render a theme-independent, compact QR code.

              Each terminal character represents two vertical QR modules:
              foreground colour = upper module
              background colour = lower module

              This keeps modules close to square and avoids GitHub dark/light
              theme inversion problems.
              """

              qr = qrcode.QRCode(
                  version=None,
                  error_correction=qrcode.constants.ERROR_CORRECT_M,
                  box_size=1,
                  border=4,
              )
              qr.add_data(url)
              qr.make(fit=True)

              matrix = qr.get_matrix()

              if len(matrix) % 2:
                  matrix.append(
                      [False] * len(matrix[0])
                  )

              for row_index in range(0, len(matrix), 2):
                  upper = matrix[row_index]
                  lower = matrix[row_index + 1]

                  parts = []

                  for top_black, bottom_black in zip(upper, lower):
                      fg = FG_BLACK if top_black else FG_WHITE
                      bg = BG_BLACK if bottom_black else BG_WHITE

                      # Upper half-block: foreground is top module,
                      # background is bottom module.
                      parts.append(
                          f"{fg}{bg}▀"
                      )

                  print(
                      "".join(parts) + RESET,
                      flush=True,
                  )


          async def main():
              api_id_raw = os.environ.get(
                  "TELEGRAM_API_ID",
                  "",
              ).strip()

              api_hash = os.environ.get(
                  "TELEGRAM_API_HASH",
                  "",
              ).strip()

              if not api_id_raw.isdigit():
                  raise SystemExit(
                      "ERROR: TELEGRAM_API_ID missing or invalid."
                  )

              if not api_hash:
                  raise SystemExit(
                      "ERROR: TELEGRAM_API_HASH missing."
                  )

              client = TelegramClient(
                  StringSession(),
                  int(api_id_raw),
                  api_hash,
              )

              await client.connect()

              try:
                  qr_login = await client.qr_login()

                  print("", flush=True)
                  print("===================================", flush=True)
                  print(" TELEGRAM QR LOGIN", flush=True)
                  print("===================================", flush=True)
                  print(
                      "Phone: Telegram -> Settings -> Devices -> Link Desktop Device",
                      flush=True,
                  )
                  print(
                      "Scan the QR code below while this step is RUNNING.",
                      flush=True,
                  )
                  print(
                      "The workflow waits up to 8 minutes.",
                      flush=True,
                  )
                  print("", flush=True)

                  render_qr_for_github(
                      qr_login.url
                  )

                  print("", flush=True)
                  print(
                      "QR CODE IS READY - SCAN IT NOW.",
                      flush=True,
                  )
                  print(
                      "Waiting for Telegram confirmation...",
                      flush=True,
                  )

                  try:
                      await qr_login.wait(
                          timeout=480
                      )

                  except asyncio.TimeoutError:
                      raise SystemExit(
                          "ERROR: QR login timed out after 8 minutes. "
                          "Run the workflow again and scan the code "
                          "while the step is still running."
                      )

                  except SessionPasswordNeededError:
                      raise SystemExit(
                          "ERROR: Telegram 2-step verification is enabled. "
                          "For security, do not enter the 2FA password "
                          "through GitHub workflow inputs or logs."
                      )

                  if not await client.is_user_authorized():
                      raise SystemExit(
                          "ERROR: Telegram login was not authorized."
                      )

                  session_string = client.session.save()

                  Path(
                      "telegram-session.txt"
                  ).write_text(
                      session_string,
                      encoding="utf-8",
                  )

                  print("", flush=True)
                  print("LOGIN SUCCESSFUL", flush=True)
                  print(
                      "telegram-session.txt created.",
                      flush=True,
                  )
                  print(
                      "The session value is NOT printed in the workflow log.",
                      flush=True,
                  )

              finally:
                  await client.disconnect()


          asyncio.run(main())
          PY

      - name: Upload Telegram session as temporary artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegram-session-PRIVATE
          path: telegram-session.txt
          if-no-files-found: error
          retention-days: 1
