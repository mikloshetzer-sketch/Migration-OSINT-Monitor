name: Create Telegram Session

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-telegram-session:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "telethon>=1.36,<2" "qrcode>=7.4,<9"

      - name: Create Telegram StringSession by QR login
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          python -u - <<'PY'
          import asyncio
          import os
          from pathlib import Path

          import qrcode
          from telethon import TelegramClient
          from telethon.errors import SessionPasswordNeededError
          from telethon.sessions import StringSession

          async def main():
              api_id_raw = os.environ.get("TELEGRAM_API_ID", "").strip()
              api_hash = os.environ.get("TELEGRAM_API_HASH", "").strip()

              if not api_id_raw.isdigit():
                  raise SystemExit("ERROR: TELEGRAM_API_ID missing or invalid.")
              if not api_hash:
                  raise SystemExit("ERROR: TELEGRAM_API_HASH missing.")

              client = TelegramClient(
                  StringSession(),
                  int(api_id_raw),
                  api_hash,
              )

              await client.connect()

              try:
                  qr_login = await client.qr_login()

                  print("", flush=True)
                  print("===================================", flush=True)
                  print(" TELEGRAM QR LOGIN", flush=True)
                  print("===================================", flush=True)
                  print("Open Telegram on your phone:", flush=True)
                  print("Settings -> Devices -> Link Desktop Device", flush=True)
                  print("Then scan the QR code below.", flush=True)
                  print("", flush=True)
                  print("The workflow waits up to 5 minutes.", flush=True)
                  print("", flush=True)

                  qr = qrcode.QRCode(
                      version=None,
                      box_size=1,
                      border=2,
                  )
                  qr.add_data(qr_login.url)
                  qr.make(fit=True)

                  for row in qr.get_matrix():
                      print(
                          "".join(
                              "██" if cell else "  "
                              for cell in row
                          ),
                          flush=True,
                      )

                  print("", flush=True)
                  print("QR CODE IS READY - SCAN IT NOW.", flush=True)
                  print("Waiting for QR confirmation...", flush=True)

                  try:
                      await qr_login.wait(timeout=300)
                  except asyncio.TimeoutError:
                      raise SystemExit(
                          "ERROR: QR login timed out after 5 minutes. "
                          "Run the workflow again and scan the QR code "
                          "while this step is still running."
                      )
                  except SessionPasswordNeededError:
                      raise SystemExit(
                          "ERROR: Telegram 2-step verification password is enabled. "
                          "Do not put that password into workflow inputs or logs."
                      )

                  if not await client.is_user_authorized():
                      raise SystemExit(
                          "ERROR: Telegram login was not authorized."
                      )

                  session_string = client.session.save()
                  Path("telegram-session.txt").write_text(
                      session_string,
                      encoding="utf-8",
                  )

                  print("", flush=True)
                  print("LOGIN SUCCESSFUL", flush=True)
                  print("telegram-session.txt created.", flush=True)
                  print(
                      "Download the private artifact and save its contents "
                      "as GitHub Secret TELEGRAM_SESSION.",
                      flush=True,
                  )
                  print(
                      "The session value is NOT printed to the workflow log.",
                      flush=True,
                  )

              finally:
                  await client.disconnect()

          asyncio.run(main())
          PY

      - name: Upload Telegram session as temporary artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegram-session-PRIVATE
          path: telegram-session.txt
          if-no-files-found: error
          retention-days: 1

