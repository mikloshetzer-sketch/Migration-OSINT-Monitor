name: Telegram Historical Backfill

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Inclusive start date (YYYY-MM-DD)"
        required: true
        default: "2026-07-15"
        type: string

      end_date:
        description: "Inclusive end date (YYYY-MM-DD)"
        required: true
        default: "2026-08-05"
        type: string

      max_posts_per_day:
        description: "Hard Telegram post budget per day"
        required: true
        default: "120"
        type: string

      max_total_posts:
        description: "Hard Telegram post budget for the whole run"
        required: true
        default: "2500"
        type: string

      reprocess_existing:
        description: "Reprocess existing Telegram data in the selected interval"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  telegram-historical-backfill:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Migration OSINT database
        id: restore-database
        uses: actions/cache/restore@v4
        with:
          path: database/migration_osint_monitor.db
          key: migration-osint-db-${{ github.run_id }}
          restore-keys: |
            migration-osint-db-

      - name: Verify restored database
        run: |
          if [ -f database/migration_osint_monitor.db ]; then
            echo "Existing migration_osint_monitor.db restored."
            ls -lh database/migration_osint_monitor.db
          else
            echo "ERROR: Telegram backfill requires the existing database."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "telethon>=1.44,<2"

      - name: Show Telegram backfill configuration
        run: |
          echo "==================================="
          echo "TELEGRAM HISTORICAL BACKFILL"
          echo "==================================="
          echo "Start date: ${{ inputs.start_date }}"
          echo "End date: ${{ inputs.end_date }}"
          echo "Max posts/day: ${{ inputs.max_posts_per_day }}"
          echo "Max total posts: ${{ inputs.max_total_posts }}"
          echo "Reprocess existing: ${{ inputs.reprocess_existing }}"
          echo "X: DISABLED"
          echo "Reddit: DISABLED"
          echo "Mastodon: DISABLED"
          echo "Telegram: ENABLED"

      - name: Run Telegram historical backfill
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}

          TELEGRAM_BACKFILL_START_DATE: ${{ inputs.start_date }}
          TELEGRAM_BACKFILL_END_DATE: ${{ inputs.end_date }}
          TELEGRAM_BACKFILL_MAX_POSTS_PER_DAY: ${{ inputs.max_posts_per_day }}
          TELEGRAM_BACKFILL_MAX_TOTAL_POSTS: ${{ inputs.max_total_posts }}
          TELEGRAM_BACKFILL_REPROCESS_EXISTING: ${{ inputs.reprocess_existing }}

        run: |
          python analysis/telegram_backfill.py

      - name: Verify Telegram reprocess result
        env:
          TELEGRAM_BACKFILL_START_DATE: ${{ inputs.start_date }}
          TELEGRAM_BACKFILL_END_DATE: ${{ inputs.end_date }}
        run: |
          python - <<'PY'
          import os
          from datetime import date, datetime, time, timedelta

          from database.database import get_session
          from database.models import CollectedPost, InfluenceSignal, Post

          start_date = date.fromisoformat(
              os.environ["TELEGRAM_BACKFILL_START_DATE"]
          )
          end_date = date.fromisoformat(
              os.environ["TELEGRAM_BACKFILL_END_DATE"]
          )

          start_dt = datetime.combine(
              start_date,
              time.min,
          )
          end_dt = datetime.combine(
              end_date + timedelta(days=1),
              time.min,
          )

          session = get_session()

          try:
              collected = (
                  session.query(CollectedPost)
                  .filter(
                      CollectedPost.source == "TELEGRAM",
                      CollectedPost.published_at >= start_dt,
                      CollectedPost.published_at < end_dt,
                  )
                  .count()
              )

              operational = (
                  session.query(Post)
                  .filter(
                      Post.source == "TELEGRAM",
                      Post.published_at >= start_dt,
                      Post.published_at < end_dt,
                  )
                  .count()
              )

              influence = (
                  session.query(InfluenceSignal)
                  .filter(
                      InfluenceSignal.source == "TELEGRAM",
                      InfluenceSignal.published_at >= start_dt,
                      InfluenceSignal.published_at < end_dt,
                  )
                  .count()
              )

              print(
                  "Telegram CollectedPost rows in interval:",
                  collected,
              )
              print(
                  "Telegram operational Post rows in interval:",
                  operational,
              )
              print(
                  "Telegram InfluenceSignal rows in interval:",
                  influence,
              )

          finally:
              session.close()
          PY

      - name: Export dashboard data
        run: |
          python -m dashboard.export_dashboard_data

      - name: Verify dashboard JSON
        run: |
          if [ -f dashboard-data.json ]; then
            echo "dashboard-data.json generated successfully."
            ls -lh dashboard-data.json
          else
            echo "ERROR: dashboard-data.json was not generated."
            exit 1
          fi

      - name: Publish dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dashboard-data.json

          if git diff --cached --quiet; then
            echo "No dashboard data changes to commit."
          else
            git commit -m "Update Telegram historical migration data"
            git push origin HEAD:main
          fi

      - name: Verify database after backfill
        if: always()
        run: |
          if [ -f database/migration_osint_monitor.db ]; then
            echo "migration_osint_monitor.db exists after Telegram backfill."
            ls -lh database/migration_osint_monitor.db
          else
            echo "WARNING: migration_osint_monitor.db was not found."
          fi

      - name: Save Migration OSINT database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: database/migration_osint_monitor.db
          key: migration-osint-db-${{ github.run_id }}

